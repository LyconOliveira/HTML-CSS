<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de Hover</title>
    <style>
        div > p{
            display: none;
        }
        div:hover > p{
            display: block;
            color: blue;
            text-align: right;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            
        }
        Div:hover{
            background-color: black;
            color: red;
            
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse no texto abaixo</p>
    <div>
        Passe o mouse aqui
        <p>Olá, mundo estou começando a entender</p>
    </div>
    <p><a href="links.html">Proxima</a></p>
</body>
</html>
