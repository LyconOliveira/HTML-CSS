<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixa</title>
    <style>
        h1{ 
            background-color: lightgray;
            height: 200px;
            width: 200px;
            
        
            border: 20px solid darkslategray;
            padding: 10px;
            margin: 20px;
            outline: 10px dashed salmon;

        }
        a{
            border: 5px solid darkslategray;
            padding:0px;
            margin: 2px;
        
        }
        a:hover{
            color: yellow;
            border: 50px dashed red;
        }
        
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a> vamos ver como tudo isso funcionar</p>
    <p>ter contro + shift + i para abrir a opçaõ de inspecionar </p>
</body>
</html>
