<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML 5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente.</h1>
    <p>Esse vídeo está hospedado no meu próprio servidor.</p>
    <h2>Forma simples</h2>
    <video src="midias/Meu-Video.webm.webm" width="200" controls></video>
    <h2>Forma ideal de colocar vídeos</h2>
    <video width="200" poster="imagens/Rio.png" controls>
        <source src="midias/meu-video.mp4.mp4" type="video/mp4">
        <source src="midias/Meu-Video.webm.webm" type="video/webm">
        <p>Seu navegador não tem compatibilidadde com reprodução de vídeos</p>
    </video>
</body>
</html>
