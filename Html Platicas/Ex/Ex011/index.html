<!DOCTYPE html>
<html lang="enpt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <H1>Imagem Dinâmicaa</H1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o do seu navegador.</p>
    <picture>
        <source media="(max-width:750px )" srcset="imagens/imagen.p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/imagen.m.png" type="image/png">
        <img src="Imagens/imagen.g.png" alt="Imagem Flexível">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="midias/guanacast-33.mp3" type="audio/mpeg">
        <source src="midias/guanacast-33.ogg" type="audio/ogg">
        <source src="midias/guanacast-33.wav" type="audio/wav">
        <p>Infelizmente o seu navegador não reproduz áudio <a href="midias/guanacast-33.mp3"> clique aqui para baixar o áudio</a> áudio clique aqui para baixar o áudio</p>
    </audio>
</body>
</html>
